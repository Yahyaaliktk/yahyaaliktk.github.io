<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>404 — ALI</title>
    <style>
      :root {
        --bg: #0a0a0a;
        --fg: #f7f4ee;
        --dim: #8f8a80;
        --accent: #f4f1ea;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
      }
      .wrap {
        max-width: 560px;
      }
      .code {
        font-size: clamp(72px, 20vw, 160px);
        font-weight: 700;
        line-height: 0.9;
        letter-spacing: -0.04em;
        color: transparent;
        -webkit-text-stroke: 1px var(--accent);
      }
      h1 {
        margin: 18px 0 10px;
        font-size: clamp(22px, 5vw, 32px);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      p {
        color: var(--dim);
        line-height: 1.6;
        margin-bottom: 26px;
      }
      a {
        display: inline-block;
        padding: 13px 24px;
        border: 1px solid var(--accent);
        border-radius: 999px;
        color: var(--bg);
        background: var(--accent);
        text-decoration: none;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.2em;
      }
      a:hover {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <div class="code">404</div>
      <h1>This frame is missing</h1>
      <p>The page you wanted is not here. Head back to the main reel.</p>
      <a href="/gc_yahya/">BACK TO ALI</a>
    </main>
  </body>
</html>
